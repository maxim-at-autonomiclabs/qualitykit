<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Google Tag Manager -->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-PPSVMCXJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Dashboard — QualityKit Pro</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-PPSVMCXJ"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <div class="wrap">
      <header class="top">
        <a class="brand" href="https://qualitykit.dev">QualityKit</a>
        <nav>
          <a href="/pricing.html">Pricing</a>
          <button class="linkish" id="sign-in">Sign in</button>
          <button class="linkish" id="sign-out" hidden>Sign out</button>
        </nav>
      </header>
      <main class="doc" id="app">
        <p id="status">Loading…</p>
        <div id="panel" hidden>
          <h1>Monitoring</h1>
          <p id="plan-line"></p>
          <div class="row" id="billing-row">
            <button class="btn primary" id="upgrade">Upgrade to Pro — $29/mo</button>
            <button class="btn ghost" id="portal" hidden>Billing portal</button>
          </div>
          <p id="free-note" class="lede" hidden>
            Add a production site and force crawls after you upgrade. The local MCP stays free.
          </p>
          <div id="pro-tools" hidden>
            <button class="btn ghost" id="mint-key">Create MCP API key</button>
            <pre id="key-out" class="mono" hidden></pre>
            <form id="site-form" class="site-form">
              <label>
                Production URL
                <input name="url" type="url" placeholder="https://example.com" required />
              </label>
              <button class="btn primary" type="submit">Add site &amp; force crawl</button>
            </form>
            <div id="sites"></div>
            <div id="latest" class="mono"></div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
